<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Nest</title>
</head>
<body>
  <h1>Nest – Verbindungstest</h1>
  <p id="status">Teste Verbindung...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "DEINE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "DEIN_ANON_KEY";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function testConnection() {
      const { data, error } = await client.from('households').select('name');
      document.getElementById('status').textContent = error
        ? "Fehler: " + error.message
        : "Verbunden! Gefundene Haushalte: " + JSON.stringify(data);
    }

    testConnection();
  </script>
</body>
</html>
