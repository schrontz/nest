<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nest</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nest">
  <meta name="theme-color" content="#abdeba">
</head>
<body>
  <h1>Nest</h1>

  <div id="login-view">
    <input type="email" id="email" placeholder="E-Mail">
    <input type="password" id="password" placeholder="Passwort">
    <button id="auth-submit-btn" onclick="submitAuth()">Login</button>
    <p id="login-status"></p>
    <p><a href="#" id="auth-mode-toggle" onclick="toggleAuthMode(); return false;">Noch keinen Account? Registrieren</a></p>
  </div>

  <div id="onboarding-view" style="display:none;">
    <h2>Haushalt erstellen</h2>
    <input type="text" id="new-household-name" placeholder="Name (z.B. Unsere WG)">
    <button onclick="createHousehold()">Haushalt erstellen</button>
    <p id="create-household-status"></p>

    <h2>Oder: Haushalt beitreten</h2>
    <input type="text" id="join-code-input" placeholder="Code eingeben">
    <button onclick="joinHousehold()">Beitreten</button>
    <p id="join-household-status"></p>

    <button onclick="logout()">Logout</button>
  </div>

  <div id="app-view" style="display:none;">
    <nav class="tabs">
      <button class="tab-btn" id="tab-btn-liste" onclick="showTab('liste')">Liste</button>
      <button class="tab-btn" id="tab-btn-einstellungen" onclick="showTab('einstellungen')">Einstellungen</button>
    </nav>

    <div id="tab-liste" class="tab-panel">
      <div class="add-card">
        <button type="button" id="toggle-add-link" class="add-toggle-card" onclick="toggleAddForm()">+ Artikel hinzufügen</button>
        <div id="add-form" style="display:none;">
          <input type="text" id="item-name" placeholder="Name (z.B. Äpfel)">
          <input type="number" id="item-menge" placeholder="Menge" step="0.1">
          <select id="item-einheit">
            <option value="stueck">Stück</option>
            <option value="gramm">Gramm</option>
            <option value="kilogramm">Kilogramm</option>
            <option value="liter">Liter</option>
            <option value="milliliter">Milliliter</option>
            <option value="packung">Packung</option>
          </select>
          <select id="item-store">
            <option value="">– kein Laden –</option>
          </select>
          <button onclick="addItem()">Hinzufügen</button>
          <p id="add-status"></p>
        </div>
      </div>

      <h2>Einkaufsliste</h2>
      <div id="item-list-offen"></div>

      <p>
        <a href="#" id="toggle-gekauft-link" onclick="toggleGekauft(); return false;">Gekauft anzeigen (0)</a>
      </p>
      <ul id="item-list-gekauft" style="display:none;"></ul>
    </div>

    <div id="tab-einstellungen" class="tab-panel" style="display:none;">
      <h2>Account</h2>
      <p id="welcome"></p>
      <button onclick="logout()">Logout</button>

      <h2>Haushalt</h2>
      <p>
        <span id="household-name-display" class="item-name clickable" onclick="startEditHousehold()"></span>
      </p>
      <div id="household-edit-form" style="display:none;">
        <input type="text" id="household-name-input">
        <button onclick="saveHouseholdName()">Speichern</button>
        <button onclick="cancelEditHousehold()">Abbrechen</button>
      </div>
      <p>Beitritts-Code: <strong id="household-join-code"></strong></p>
      <img id="household-qr" alt="QR-Code zum Beitreten">

      <h2>Läden</h2>
      <input type="text" id="store-name" placeholder="Neuer Laden (z.B. Aldi)">
      <input type="text" id="store-address" placeholder="Adresse (optional)">
      <button onclick="addStore()">Laden hinzufügen</button>
      <p id="store-status"></p>
      <ul id="store-list"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qanbxxbbngctucjbzfeb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_mQWyeC7aCRJn29MuHTGG1Q_9ArG0_1J";
    const client = supabase.createClient("https://qanbxxbbngctucjbzfeb.supabase.co", "sb_publishable_mQWyeC7aCRJn29MuHTGG1Q_9ArG0_1J");

    let currentHouseholdId = null;
    let editingItemId = null;
    let allItems = [];

    const EINHEIT_LABELS = {
      stueck: "Stück", gramm: "g", kilogramm: "kg",
      liter: "l", milliliter: "ml", packung: "Packung"
    };

    let authMode = 'login';
    let currentSession = null;

    function toggleAuthMode() {
      authMode = authMode === 'login' ? 'register' : 'login';
      document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? 'Login' : 'Registrieren';
      document.getElementById('auth-mode-toggle').textContent = authMode === 'login'
        ? 'Noch keinen Account? Registrieren'
        : 'Schon registriert? Login';
      document.getElementById('login-status').textContent = '';
    }

    async function submitAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const statusEl = document.getElementById('login-status');

      if (authMode === 'login') {
        const { error } = await client.auth.signInWithPassword({ email, password });
        statusEl.textContent = error ? "Fehler: " + error.message : "";
      } else {
        const { error } = await client.auth.signUp({ email, password });
        statusEl.textContent = error ? "Fehler: " + error.message : "Konto erstellt!";
      }
    }

    async function logout() {
      await client.auth.signOut();
    }

    async function loadHouseholdId(userId) {
      const { data, error } = await client
        .from('household_members')
        .select('household_id')
        .eq('user_id', userId)
        .maybeSingle();
      if (error) {
        console.error("Konnte household_id nicht laden:", error);
        return null;
      }
      return data ? data.household_id : null;
    }

    let storesById = {};
    let allStores = [];
    let editingStoreId = null;

    async function loadStores() {
      const { data, error } = await client
        .from('stores')
        .select('*')
        .order('name');

      if (error) {
        console.error("Fehler beim Laden der Läden:", error);
        return;
      }

      allStores = data;
      storesById = {};
      data.forEach(store => { storesById[store.id] = store.name; });

      renderStoreList();

      const selectEl = document.getElementById('item-store');
      const bisherigeAuswahl = selectEl.value;
      selectEl.innerHTML = '<option value="">– kein Laden –</option>' +
        data.map(store => `<option value="${store.id}">${store.name}</option>`).join('');
      selectEl.value = bisherigeAuswahl;

      loadItems();
    }

    function renderStoreList() {
      document.getElementById('store-list').innerHTML = allStores.map(renderStoreItem).join('');
    }

    function renderStoreItem(store) {
      if (store.id === editingStoreId) {
        return `
          <li class="editing">
            <input type="text" id="edit-store-name-${store.id}" value="${escapeHtml(store.name)}" placeholder="Name">
            <input type="text" id="edit-store-address-${store.id}" value="${escapeHtml(store.address || '')}" placeholder="Adresse (optional)">
            <div class="edit-actions">
              <button onclick="saveEditStore('${store.id}')">Speichern</button>
              <button onclick="cancelEditStore()">Abbrechen</button>
            </div>
          </li>
        `;
      }
      return `
        <li>
          <span class="item-name clickable" onclick="startEditStore('${store.id}')">
            ${store.name}
            ${store.address ? `<br><small class="store-address">${store.address}</small>` : ''}
          </span>
          <button onclick="deleteStore('${store.id}')">löschen</button>
        </li>
      `;
    }

    function startEditStore(id) {
      editingStoreId = id;
      renderStoreList();
    }

    function cancelEditStore() {
      editingStoreId = null;
      renderStoreList();
    }

    async function saveEditStore(id) {
      const nameEl = document.getElementById('edit-store-name-' + id);
      const addressEl = document.getElementById('edit-store-address-' + id);
      const name = nameEl.value.trim();
      const address = addressEl.value.trim();
      if (!name) return;

      const { error } = await client
        .from('stores')
        .update({ name: name, address: address || null })
        .eq('id', id);

      if (error) {
        console.error("Fehler beim Speichern:", error);
        return;
      }
      editingStoreId = null;
      loadStores();
    }

    async function deleteStore(id) {
      const laden = storesById[id] || "diesen Laden";
      if (!confirm(`"${laden}" wirklich löschen? Zugeordnete Artikel verlieren dann ihre Laden-Zuordnung.`)) {
        return;
      }
      const { error } = await client.from('stores').delete().eq('id', id);
      if (error) {
        console.error("Fehler beim Löschen:", error);
        return;
      }
      loadStores();
    }

    async function addStore() {
      const nameEl = document.getElementById('store-name');
      const addressEl = document.getElementById('store-address');
      const name = nameEl.value.trim();
      const address = addressEl.value.trim();
      const statusEl = document.getElementById('store-status');

      if (!name) {
        statusEl.textContent = "Bitte einen Namen eingeben.";
        return;
      }

      const { error } = await client.from('stores').insert({
        household_id: currentHouseholdId,
        name: name,
        address: address || null
      });

      if (error) {
        statusEl.textContent = "Fehler: " + error.message;
      } else {
        statusEl.textContent = "\"" + name + "\" hinzugefügt!";
        nameEl.value = "";
        addressEl.value = "";
        loadStores();
      }
    }

    function showTab(tab) {
      document.getElementById('tab-liste').style.display = tab === 'liste' ? 'block' : 'none';
      document.getElementById('tab-einstellungen').style.display = tab === 'einstellungen' ? 'block' : 'none';
      document.getElementById('tab-btn-liste').classList.toggle('active', tab === 'liste');
      document.getElementById('tab-btn-einstellungen').classList.toggle('active', tab === 'einstellungen');
    }

    async function showApp(session) {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('onboarding-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
      document.getElementById('welcome').textContent = "Eingeloggt als " + session.user.email;
      showTab('liste');
      loadStores();
      loadHousehold();
      subscribeToChanges();
    }

    function showOnboarding() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'none';
      document.getElementById('onboarding-view').style.display = 'block';
    }

    function subscribeToChanges() {
      client
        .channel('shopping_items_changes')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'shopping_items', filter: `household_id=eq.${currentHouseholdId}` },
          () => { loadItems(); }
        )
        .subscribe();
    }

    function showLogin() {
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('onboarding-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'none';
    }

    client.auth.onAuthStateChange(async (event, session) => {
      currentSession = session;
      if (session) {
        currentHouseholdId = await loadHouseholdId(session.user.id);
        if (currentHouseholdId) {
          showApp(session);
        } else {
          showOnboarding();
        }
      } else {
        showLogin();
      }
    });

    async function createHousehold() {
      const nameEl = document.getElementById('new-household-name');
      const name = nameEl.value.trim();
      const statusEl = document.getElementById('create-household-status');

      if (!name) {
        statusEl.textContent = "Bitte einen Namen eingeben.";
        return;
      }

      const { data, error } = await client.rpc('create_household', { household_name: name });

      if (error) {
        statusEl.textContent = "Fehler: " + error.message;
        return;
      }

      currentHouseholdId = data[0].id;
      showApp(currentSession);
    }

    async function joinHousehold() {
      const codeEl = document.getElementById('join-code-input');
      const code = codeEl.value.trim();
      const statusEl = document.getElementById('join-household-status');

      if (!code) {
        statusEl.textContent = "Bitte einen Code eingeben.";
        return;
      }

      const { data, error } = await client.rpc('join_household_by_code', { code: code });

      if (error) {
        statusEl.textContent = "Fehler: " + error.message;
        return;
      }

      currentHouseholdId = data;
      showApp(currentSession);
    }

    let currentHousehold = null;

    async function loadHousehold() {
      const { data, error } = await client
        .from('households')
        .select('*')
        .eq('id', currentHouseholdId)
        .single();

      if (error) {
        console.error("Fehler beim Laden des Haushalts:", error);
        return;
      }

      currentHousehold = data;
      renderHousehold();
    }

    function renderHousehold() {
      document.getElementById('household-name-display').textContent = currentHousehold.name;
      document.getElementById('household-join-code').textContent = currentHousehold.join_code;
      document.getElementById('household-qr').src =
        `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentHousehold.join_code)}`;
    }

    function startEditHousehold() {
      document.getElementById('household-name-input').value = currentHousehold.name;
      document.getElementById('household-edit-form').style.display = 'block';
    }

    function cancelEditHousehold() {
      document.getElementById('household-edit-form').style.display = 'none';
    }

    async function saveHouseholdName() {
      const name = document.getElementById('household-name-input').value.trim();
      if (!name) return;

      const { error } = await client.from('households').update({ name: name }).eq('id', currentHouseholdId);
      if (error) {
        console.error("Fehler beim Speichern:", error);
        return;
      }
      document.getElementById('household-edit-form').style.display = 'none';
      loadHousehold();
    }

    async function addItem() {
      const name = document.getElementById('item-name').value.trim();
      const menge = document.getElementById('item-menge').value;
      const einheit = document.getElementById('item-einheit').value;
      const storeId = document.getElementById('item-store').value;
      const statusEl = document.getElementById('add-status');

      if (!name) {
        statusEl.textContent = "Bitte einen Namen eingeben.";
        return;
      }

      const { data: { user } } = await client.auth.getUser();

      const { error } = await client.from('shopping_items').insert({
        household_id: currentHouseholdId,
        name: name,
        menge: menge ? parseFloat(menge) : null,
        einheit: einheit,
        store_id: storeId || null,
        created_by: user.id
      });

      if (error) {
        statusEl.textContent = "Fehler: " + error.message;
      } else {
        statusEl.textContent = "\"" + name + "\" hinzugefügt!";
        document.getElementById('item-name').value = "";
        document.getElementById('item-menge').value = "";
      }
    }

    function toggleAddForm() {
      const formEl = document.getElementById('add-form');
      const istOffen = formEl.style.display !== 'none';
      formEl.style.display = istOffen ? 'none' : 'block';
      document.getElementById('toggle-add-link').textContent = istOffen ? "+ Artikel hinzufügen" : "– Formular schließen";
    }

    let showGekauft = false;

    function toggleGekauft() {
      showGekauft = !showGekauft;
      document.getElementById('item-list-gekauft').style.display = showGekauft ? 'block' : 'none';
      updateToggleLabel();
    }

    function updateToggleLabel() {
      const count = document.getElementById('item-list-gekauft').children.length;
      const link = document.getElementById('toggle-gekauft-link');
      link.textContent = (showGekauft ? "Gekauft ausblenden (" : "Gekauft anzeigen (") + count + ")";
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function einheitOptions(selected) {
      return Object.entries(EINHEIT_LABELS).map(([val, label]) =>
        `<option value="${val}" ${val === selected ? 'selected' : ''}>${label}</option>`
      ).join('');
    }

    function storeOptions(selectedId) {
      const leer = `<option value="">– kein Laden –</option>`;
      const optionen = Object.entries(storesById).map(([id, name]) =>
        `<option value="${id}" ${id === selectedId ? 'selected' : ''}>${name}</option>`
      ).join('');
      return leer + optionen;
    }

    function startEdit(id) {
      editingItemId = id;
      render();
    }

    function cancelEdit() {
      editingItemId = null;
      render();
    }

    async function saveEdit(id) {
      const name = document.getElementById('edit-name-' + id).value.trim();
      const menge = document.getElementById('edit-menge-' + id).value;
      const einheit = document.getElementById('edit-einheit-' + id).value;
      const storeId = document.getElementById('edit-store-' + id).value;

      if (!name) return;

      const { error } = await client
        .from('shopping_items')
        .update({
          name: name,
          menge: menge ? parseFloat(menge) : null,
          einheit: einheit,
          store_id: storeId || null
        })
        .eq('id', id);

      if (error) {
        console.error("Fehler beim Speichern:", error);
        return;
      }
      editingItemId = null;
    }

    function renderItem(item) {
      if (item.id === editingItemId) {
        return `
          <li class="editing">
            <input type="text" id="edit-name-${item.id}" value="${escapeHtml(item.name)}">
            <input type="number" id="edit-menge-${item.id}" value="${item.menge ?? ''}" step="0.1" placeholder="Menge">
            <select id="edit-einheit-${item.id}">${einheitOptions(item.einheit)}</select>
            <select id="edit-store-${item.id}">${storeOptions(item.store_id)}</select>
            <div class="edit-actions">
              <button onclick="saveEdit('${item.id}')">Speichern</button>
              <button onclick="cancelEdit()">Abbrechen</button>
            </div>
          </li>
        `;
      }

      const editable = item.status === 'offen';
      const nameClass = editable ? 'item-name clickable' : 'item-name';
      const nameClick = editable ? ` onclick="startEdit('${item.id}')"` : '';

      return `
        <li style="${item.status === 'gekauft' ? 'text-decoration: line-through; color: gray;' : ''}">
          <input type="checkbox" ${item.status === 'gekauft' ? 'checked' : ''}
                 onchange="toggleStatus('${item.id}', this.checked)">
          <span class="${nameClass}"${nameClick}>
            ${item.name}
            ${item.menge ? ` – ${item.menge} ${EINHEIT_LABELS[item.einheit] || item.einheit}` : ''}
          </span>
          <button onclick="deleteItem('${item.id}')">löschen</button>
        </li>
      `;
    }

    function renderGroupedByStore(items) {
      const ohneLaden = "Ohne Laden";
      const gruppen = {};
      items.forEach(item => {
        const ladenName = item.store_id ? (storesById[item.store_id] || "Unbekannter Laden") : ohneLaden;
        if (!gruppen[ladenName]) gruppen[ladenName] = [];
        gruppen[ladenName].push(item);
      });

      const ladenNamen = Object.keys(gruppen).sort((a, b) => {
        if (a === ohneLaden) return 1;
        if (b === ohneLaden) return -1;
        return a.localeCompare(b);
      });

      return ladenNamen.map(ladenName => `
        <h3>${ladenName}</h3>
        <ul>${gruppen[ladenName].map(renderItem).join('')}</ul>
      `).join('');
    }

    async function loadItems() {
      const { data, error } = await client
        .from('shopping_items')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Fehler beim Laden:", error);
        return;
      }

      allItems = data;
      render();
    }

    function render() {
      const offen = allItems.filter(item => item.status === 'offen');
      const gekauft = allItems.filter(item => item.status === 'gekauft');

      document.getElementById('item-list-offen').innerHTML = renderGroupedByStore(offen);
      document.getElementById('item-list-gekauft').innerHTML = gekauft.map(renderItem).join('');

      updateToggleLabel();
    }

    async function toggleStatus(id, isChecked) {
      const neuerStatus = isChecked ? 'gekauft' : 'offen';
      const { error } = await client
        .from('shopping_items')
        .update({ status: neuerStatus })
        .eq('id', id);

      if (error) console.error("Fehler beim Ändern:", error);
    }

    async function deleteItem(id) {
      const { error } = await client
        .from('shopping_items')
        .delete()
        .eq('id', id);

      if (error) console.error("Fehler beim Löschen:", error);
    }
  </script>
</body>
</html>
